<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Revel board</title>
  <!--REVEL_HEAD-->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
</head>
<body>
  <!--REVEL_NAV-->
  <main class="container-fluid py-3">
    <h1 class="h4">Board</h1>
    <p class="muted">Kanban projection. Drag writes <code>payload.column</code>. Gear edits or deletes the node.</p>
    <form id="add" class="row g-2 align-items-end mb-3">
      <div class="col-auto">
        <label class="form-label mb-0" for="type">type</label>
        <select class="form-select form-select-sm" id="type" name="type" required>
          <option value="task" selected>task</option>
          <option value="project">project</option>
          <option value="milestone">milestone</option>
          <option value="file">file</option>
          <option value="email">email</option>
          <option value="event">event</option>
          <option value="lead">lead</option>
          <option value="opportunity">opportunity</option>
          <option value="account">account</option>
          <option value="contact">contact</option>
          <option value="ticket">ticket</option>
          <option value="campaign">campaign</option>
          <option value="content">content</option>
          <option value="inventory_item">inventory_item</option>
          <option value="knowledge_article">knowledge_article</option>
          <option value="user">user</option>
          <option value="group">group</option>
        </select>
      </div>
      <div class="col-auto">
        <label class="form-label mb-0" for="title">title</label>
        <input class="form-control form-control-sm" id="title" name="title" placeholder="title" required>
      </div>
      <div class="col-auto">
        <button class="btn btn-primary btn-sm" type="submit">create</button>
      </div>
    </form>
    <div class="widget-host board">
      <div class="cols" id="board"></div>
    </div>
  </main>

  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <form class="modal-content" id="editForm">
        <div class="modal-header">
          <h2 class="modal-title h5" id="editModalLabel">Edit node</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="edit-id">
          <div class="mb-2">
            <label class="form-label" for="edit-title">title</label>
            <input class="form-control form-control-sm" id="edit-title" required>
          </div>
          <div class="mb-2">
            <label class="form-label" for="edit-column">column</label>
            <select class="form-select form-select-sm" id="edit-column">
              <option value="todo">todo</option>
              <option value="doing">doing</option>
              <option value="done">done</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label" for="edit-due">due</label>
            <input class="form-control form-control-sm" id="edit-due" type="date">
          </div>
          <p class="mb-2">
            <a href="#edit-more" class="edit-toggle" id="edit-toggle" role="button" aria-expanded="false" aria-controls="edit-more">Show All</a>
          </p>
          <div class="collapse" id="edit-more">
            <div class="mb-2">
              <label class="form-label" for="edit-type">type</label>
              <input class="form-control form-control-sm" id="edit-type" readonly>
            </div>
            <div class="mb-2">
              <label class="form-label" for="edit-id-show">id</label>
              <input class="form-control form-control-sm" id="edit-id-show" readonly>
            </div>
            <div class="mb-2">
              <label class="form-label" for="edit-created">created_at</label>
              <input class="form-control form-control-sm" id="edit-created" readonly>
            </div>
            <div class="row g-2 mb-2">
              <div class="col">
                <label class="form-label" for="edit-start">start</label>
                <input class="form-control form-control-sm" id="edit-start" type="date">
              </div>
              <div class="col">
                <label class="form-label" for="edit-end">end</label>
                <input class="form-control form-control-sm" id="edit-end" type="date">
              </div>
            </div>
            <div class="mb-0">
              <label class="form-label" for="edit-extra">other payload</label>
              <textarea class="form-control form-control-sm font-monospace" id="edit-extra" rows="5" spellcheck="false"></textarea>
              <div class="form-text">JSON object. column / start / end / due stay on the fields above.</div>
            </div>
          </div>
        </div>
        <div class="modal-footer justify-content-end">
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="deleteModalLabel">Delete node</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">Are you sure you want to delete <strong id="delete-title"></strong>?</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn" id="delete-confirm" style="color: red;">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let pendingDeleteId = null;

    async function mutate(id, body) {
      const res = await fetch('/nodes/' + id, {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('mutate failed');
      return res.json();
    }

    function cardEl(item) {
      const el = document.createElement('div');
      el.className = 'card-node';
      el.dataset.id = item.id;
      el.dataset.title = item.title;
      const menuId = 'menu-' + item.id.replace(/[^a-zA-Z0-9_-]/g, '');
      el.innerHTML =
        '<div class="dropdown card-menu">' +
          '<button class="btn-gear" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Node actions">' +
            '&#9881;' +
          '</button>' +
          '<ul class="dropdown-menu" id="' + menuId + '">' +
            '<li><button class="dropdown-item js-edit" type="button">Edit</button></li>' +
            '<li><button class="dropdown-item js-delete" type="button">Delete</button></li>' +
          '</ul>' +
        '</div>' +
        '<div class="card-body-text">' +
          item.title +
          '<small>' + item.type + ' · ' + item.id.slice(0, 8) + '</small>' +
        '</div>';
      el.querySelector('.js-edit').addEventListener('click', () => openEdit(item.id));
      el.querySelector('.js-delete').addEventListener('click', () => openDelete(item.id, item.title));
      return el;
    }

    const SIMPLE_KEYS = ['column', 'start', 'end', 'due'];

    function extraPayload(payload) {
      const extra = {};
      Object.keys(payload || {}).forEach(key => {
        if (!SIMPLE_KEYS.includes(key)) extra[key] = payload[key];
      });
      return extra;
    }

    function setEditExpanded(open) {
      const pane = document.getElementById('edit-more');
      const link = document.getElementById('edit-toggle');
      const inst = bootstrap.Collapse.getOrCreateInstance(pane, {toggle: false});
      if (open) inst.show();
      else inst.hide();
      link.textContent = open ? 'Show Less' : 'Show All';
      link.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    async function openEdit(id) {
      const node = await (await fetch('/nodes/' + id)).json();
      document.getElementById('edit-id').value = node.id;
      document.getElementById('edit-id-show').value = node.id;
      document.getElementById('edit-type').value = node.type;
      document.getElementById('edit-created').value = node.created_at || '';
      document.getElementById('edit-title').value = node.title;
      document.getElementById('edit-column').value = node.payload.column || 'todo';
      document.getElementById('edit-start').value = node.payload.start || '';
      document.getElementById('edit-end').value = node.payload.end || '';
      document.getElementById('edit-due').value = node.payload.due || '';
      document.getElementById('edit-extra').value = JSON.stringify(extraPayload(node.payload), null, 2);
      setEditExpanded(false);
      bootstrap.Modal.getOrCreateInstance(document.getElementById('editModal')).show();
    }

    function openDelete(id, title) {
      pendingDeleteId = id;
      document.getElementById('delete-title').textContent = title;
      bootstrap.Modal.getOrCreateInstance(document.getElementById('deleteModal')).show();
    }

    async function render() {
      const cols = await (await fetch('/board')).json();
      const root = document.getElementById('board');
      root.innerHTML = '';
      cols.forEach(col => {
        const wrap = document.createElement('div');
        wrap.className = 'col';
        wrap.dataset.column = col.id;
        wrap.innerHTML = '<h2>' + col.title + '</h2>';
        const list = document.createElement('div');
        list.className = 'list';
        (col.item || []).forEach(item => list.appendChild(cardEl(item)));
        wrap.appendChild(list);
        root.appendChild(wrap);
        new Sortable(list, {
          group: 'revel',
          animation: 150,
          filter: '.card-menu, .btn-gear, .dropdown-menu',
          preventOnFilter: false,
          onAdd: ev => mutate(ev.item.dataset.id, {payload: {column: wrap.dataset.column}})
        });
      });
    }

    document.getElementById('add').addEventListener('submit', async ev => {
      ev.preventDefault();
      const fd = new FormData(ev.target);
      await fetch('/nodes', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({type: fd.get('type'), title: fd.get('title')})
      });
      ev.target.title.value = '';
      render();
    });

    document.getElementById('edit-toggle').addEventListener('click', ev => {
      ev.preventDefault();
      const open = document.getElementById('edit-toggle').getAttribute('aria-expanded') === 'true';
      setEditExpanded(!open);
    });
    document.getElementById('edit-more').addEventListener('shown.bs.collapse', () => {
      const link = document.getElementById('edit-toggle');
      link.textContent = 'Show Less';
      link.setAttribute('aria-expanded', 'true');
    });
    document.getElementById('edit-more').addEventListener('hidden.bs.collapse', () => {
      const link = document.getElementById('edit-toggle');
      link.textContent = 'Show All';
      link.setAttribute('aria-expanded', 'false');
    });

    document.getElementById('editForm').addEventListener('submit', async ev => {
      ev.preventDefault();
      const id = document.getElementById('edit-id').value;
      let extra = {};
      const raw = document.getElementById('edit-extra').value.trim();
      if (raw) {
        try {
          extra = JSON.parse(raw);
        } catch (err) {
          document.getElementById('edit-extra').focus();
          setEditExpanded(true);
          return;
        }
        if (extra === null || Array.isArray(extra) || typeof extra !== 'object') {
          setEditExpanded(true);
          return;
        }
      }
      SIMPLE_KEYS.forEach(key => { delete extra[key]; });
      await mutate(id, {
        title: document.getElementById('edit-title').value,
        payload: {
          ...extra,
          column: document.getElementById('edit-column').value,
          start: document.getElementById('edit-start').value,
          end: document.getElementById('edit-end').value,
          due: document.getElementById('edit-due').value
        }
      });
      bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
      render();
    });

    document.getElementById('delete-confirm').addEventListener('click', async () => {
      if (!pendingDeleteId) return;
      const res = await fetch('/nodes/' + pendingDeleteId, {method: 'DELETE'});
      if (!res.ok) return;
      pendingDeleteId = null;
      bootstrap.Modal.getInstance(document.getElementById('deleteModal')).hide();
      render();
    });

    render();
  </script>
</body>
</html>
